
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Eswatini Jobs Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  color: #182235;
  visibility: hidden;
}

header {
  background: #10264a;
  color: white;
  padding: 22px;
}

header h1 {
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #cbd5e1;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 15px;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 12px;
  margin-bottom: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

h2 {
  color: #10264a;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: 0;
  padding: 11px 15px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 12px;
}

.primary {
  background: #059669;
  color: white;
  width: 100%;
  padding: 14px;
  font-size: 16px;
}

.publish {
  background: #059669;
  color: white;
}

.unpublish {
  background: #eab308;
  color: #182235;
}

.delete {
  background: #dc2626;
  color: white;
}

.logout {
  background: #dc2626;
  color: white;
  float: right;
}

.job {
  border: 1px solid #e2e8f0;
  padding: 17px;
  border-radius: 9px;
  margin-top: 15px;
}

.job h3 {
  margin: 0 0 8px;
  color: #10264a;
}

.status {
  font-weight: bold;
}

#message {
  margin-top: 15px;
  font-weight: bold;
}

.small {
  color: #64748b;
  font-size: 13px;
}

a {
  color: #059669;
}

@media(max-width:600px) {
  .panel {
    padding: 16px;
  }

  header {
    padding: 18px;
  }
}
</style>
</head>

<body>

<header>
  <button class="logout" id="logoutButton">Logout</button>
  <h1>Eswatini Jobs Hub</h1>
  <p>Administrator Dashboard</p>
</header>

<div class="container">

  <section class="panel">
    <h2>Add a New Vacancy</h2>

    <form id="jobForm">

      <label for="title">Job Title</label>
      <input id="title" required placeholder="Example: Finance Officer">

      <label for="employer">Employer</label>
      <input id="employer" required placeholder="Company or organisation">

      <label for="country">Country</label>
      <select id="country" required>
        <option value="Eswatini">Eswatini</option>
        <option value="South Africa">South Africa</option>
      </select>

      <label for="location">Location</label>
      <input id="location" required placeholder="Example: Mbabane">

      <label for="salary">Salary</label>
      <input id="salary" placeholder="Example: Negotiable">

      <label for="closing_date">Closing Date</label>
      <input id="closing_date" type="date" required>

      <label for="requirements">Requirements</label>
      <textarea id="requirements" required placeholder="Enter job requirements"></textarea>

      <label for="application_link">Official Application Link</label>
      <input id="application_link" type="url" required placeholder="https://example.com/apply">

      <label for="status">Publication Status</label>
      <select id="status">
        <option value="draft">Save as Draft</option>
        <option value="published">Publish Immediately</option>
      </select>

      <button class="primary" id="saveButton" type="submit">
        Save Vacancy
      </button>

      <p id="message" role="status"></p>

    </form>
  </section>

  <section class="panel">
    <h2>Manage Vacancies</h2>
    <p class="small">Vacancies saved in your Supabase database.</p>
    <button class="publish" id="refreshButton">Refresh Vacancies</button>
    <div id="jobsList">Loading vacancies...</div>
  </section>

  <p><a href="index.html">← Return to Homepage</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://estfnipzuevqiomildog.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vw3gedgG9p8oY7rmlYXFWg_p9t1iCR7";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
const jobForm = document.getElementById("jobForm");
const saveButton = document.getElementById("saveButton");
const jobsList = document.getElementById("jobsList");

let adminReady = false;

// SECURITY CHECK
async function checkAdminAccess() {
  try {
    const { data: { session }, error } =
      await client.auth.getSession();

    if (error || !session) {
      window.location.replace("login.html");
      return;
    }

    const { data: isAdmin, error: adminError } =
      await client.rpc("is_admin");

    if (adminError || isAdmin !== true) {
      await client.auth.signOut();
      window.location.replace("login.html");
      return;
    }

    adminReady = true;
    document.body.style.visibility = "visible";

    await loadJobs();

  } catch (error) {
    window.location.replace("login.html");
  }
}

// LOAD VACANCIES
async function loadJobs() {
  if (!adminReady) return;

  jobsList.textContent = "Loading vacancies...";

  const { data, error } = await client
    .from("jobs")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    jobsList.textContent = "Could not load vacancies: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    jobsList.textContent = "No vacancies saved yet.";
    return;
  }

  jobsList.innerHTML = "";

  data.forEach(job => {
    const card = document.createElement("div");
    card.className = "job";

    const title = document.createElement("h3");
    title.textContent = job.title;

    const details = document.createElement("p");
    details.textContent =
      job.employer + " | " + job.country + " | " + job.location;

    const deadline = document.createElement("p");
    deadline.textContent = "Closing date: " + job.closing_date;

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Status: " + job.status.toUpperCase();

    const publishButton = document.createElement("button");
    publishButton.className =
      job.status === "published" ? "unpublish" : "publish";

    publishButton.textContent =
      job.status === "published" ? "Unpublish" : "Publish";

    publishButton.addEventListener("click", () => {
      changeStatus(job.id, job.status);
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";

    deleteButton.addEventListener("click", () => {
      deleteJob(job.id);
    });

    card.append(
      title,
      details,
      deadline,
      status,
      publishButton,
      deleteButton
    );

    jobsList.appendChild(card);
  });
}

// SAVE NEW VACANCY
jobForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!adminReady) return;

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";
  message.textContent = "";

  const applicationLink =
    document.getElementById("application_link").value.trim();

  if (!["http:", "https:"].includes(new URL(applicationLink).protocol)) {
    message.textContent = "Please enter a valid HTTP or HTTPS application link.";
    saveButton.disabled = false;
    saveButton.textContent = "Save Vacancy";
    return;
  }

  const vacancy = {
    title: document.getElementById("title").value.trim(),
    employer: document.getElementById("employer").value.trim(),
    country: document.getElementById("country").value,
    location: document.getElementById("location").value.trim(),
    salary: document.getElementById("salary").value.trim(),
    closing_date: document.getElementById("closing_date").value,
    requirements: document.getElementById("requirements").value.trim(),
    application_link: applicationLink,
    status: document.getElementById("status").value
  };

  const { error } = await client
    .from("jobs")
    .insert([vacancy]);

  if (error) {
    message.textContent = "Error: " + error.message;
  } else {
    message.textContent = "Vacancy saved successfully!";
    jobForm.reset();
    await loadJobs();
  }

  saveButton.disabled = false;
  saveButton.textContent = "Save Vacancy";
});

// PUBLISH OR UNPUBLISH
async function changeStatus(id, currentStatus) {
  if (!adminReady) return;

  const newStatus =
    currentStatus === "published" ? "draft" : "published";

  const { error } = await client
    .from("jobs")
    .update({ status: newStatus })
    .eq("id", id);

  if (error) {
    alert("Could not update vacancy: " + error.message);
    return;
  }

  await loadJobs();
}

// DELETE VACANCY
async function deleteJob(id) {
  if (!adminReady) return;

  if (!confirm("Are you sure you want to delete this vacancy?")) {
    return;
  }

  const { error } = await client
    .from("jobs")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete vacancy: " + error.message);
    return;
  }

  await loadJobs();
}

// REFRESH
document.getElementById("refreshButton")
  .addEventListener("click", loadJobs);

// LOGOUT
document.getElementById("logoutButton")
  .addEventListener("click", async function() {
    await client.auth.signOut();
    window.location.replace("login.html");
  });

// START
checkAdminAccess();
</script>

</body>
  </html>
