
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Eswatini Jobs Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1730;
    }
    .login-box {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 32px;
      border-radius: 16px;
    }
    h1 { color: #10264a; margin-bottom: 8px; }
    p { color: #64748b; line-height: 1.5; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: #059669;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 16px; font-size: 14px; }
    a { color: #059669; }
  </style>
</head>
<body>

<div class="login-box">
  <h1>Admin Login</h1>
  <p>Eswatini Jobs Hub management portal.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" required autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button id="loginButton" type="submit">Login securely</button>
  </form>

  <p id="message" role="status"></p>
  <a href="index.html">← Back to homepage</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://estfnipzuevqiomildog.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vw3gedgG9p8oY7rmlYXFWg_p9t1iCR7";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  message.textContent = "Checking your login...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const { data: isAdmin, error: adminError } =
      await client.rpc("is_admin");

    if (adminError) throw adminError;

    if (isAdmin !== true) {
      await client.auth.signOut();
      throw new Error("This account is not authorised as an administrator.");
    }

    message.textContent = "Login successful! Opening dashboard...";
    window.location.href = "admin.html";

  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
  }
});
</script>

</body>
</html>
